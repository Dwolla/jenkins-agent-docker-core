name: Build

on:
  pull_request:
    branches: ['**']
  push:
    branches: ['**']
    tags: [v*]

# The steps mirror Dwolla/jenkins-agents-workflow's build action, inlined because this image needs
# two build args (the remoting tag for the Java 21 agent JVM, and the build JDK) and the shared
# action passes one. Images are pushed only for v* tags, as <remoting tag>-build-jdk<N>-<sha>.
env:
  JENKINS_REMOTING_TAG: 3395.v6e5377b_0fb_3c-5-jdk21
  IMAGE_NAME: dwolla/jenkins-agent-core

jobs:
  build:
    strategy:
      matrix:
        build_jdk: ['11', '17', '21', '25']
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=${{ env.JENKINS_REMOTING_TAG }}-build-jdk${{ matrix.build_jdk }}-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            JENKINS_REMOTING_TAG=${{ env.JENKINS_REMOTING_TAG }}
            BUILD_JDK=${{ matrix.build_jdk }}

  build-complete:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: echo "The build completed successfully"
